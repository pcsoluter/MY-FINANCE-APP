<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14233b;--muted:#718096;--line:#e7ecf3;--navy:#101d33;--blue:#4768f5;--green:#15966a;--amber:#c08425;--red:#d24b55;--radius:22px;--shadow:0 8px 28px #243b6010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,#101d33,#1d3763);color:#fff;padding:22px max(18px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#7990ff,#4b63ee);display:grid;place-items:center;font-size:25px;font-weight:800;box-shadow:0 8px 20px #050d2244}.brand h1{font-size:20px;letter-spacing:-.03em;margin:0}.brand p{margin:3px 0 0;color:#c1cce1;font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dark{background:#ffffff12;color:#fff;border-color:#ffffff35}.btn.danger{color:var(--red)}.app{max-width:1200px;margin:auto;padding:20px 20px 42px}.tabs{display:flex;gap:7px;overflow:auto;padding:6px;background:#e9eef7;border-radius:16px;margin:0 0 22px}.tab{white-space:nowrap;border:0;background:transparent;color:#65738a;padding:11px 16px;border-radius:12px;font-weight:750}.tab.active{background:#fff;color:#2447c8;box-shadow:0 2px 8px #182d5010}.hero{background:linear-gradient(120deg,#172743,#294c84);color:#fff;border-radius:26px;padding:28px;margin-bottom:18px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px;box-shadow:0 14px 34px #18315b20}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:#b9caff;font-weight:850}.hero h2{font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.045em;margin:10px 0}.hero p{margin:0;color:#d8e2f4;max-width:570px}.hero-right{border-left:1px solid #ffffff2b;padding-left:24px;display:flex;flex-direction:column;justify-content:center;gap:10px}.big-number{font-size:clamp(29px,4vw,38px);font-weight:850;letter-spacing:-.04em}.small{font-size:12px;color:var(--muted)}.hero .small{color:#c5d2e9}.progress{height:8px;border-radius:99px;background:#ffffff2b;overflow:hidden}.progress span{display:block;height:100%;background:#69e0b0;border-radius:99px;width:0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.metric,.panel,.goal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px;font-weight:750}.metric .value{font-size:clamp(20px,2.5vw,27px);font-weight:850;margin:8px 0 4px;letter-spacing:-.04em}.metric .hint{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{margin-bottom:16px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel h3{font-size:16px;letter-spacing:-.02em;margin:0}.panel p.sub{margin:5px 0 0;color:var(--muted);font-size:12px}.rowline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.rowline:last-child{border-bottom:0}.rowline strong{display:block;font-size:14px}.rowline .meta{font-size:12px;color:var(--muted);margin-top:2px}.amount{font-weight:800;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--red)}.warning,.notice{padding:13px 15px;border-radius:15px;font-size:13px;margin-bottom:16px}.warning{background:#fff7e7;border:1px solid #f2dfb4;color:#79551b}.notice{background:#edf3ff;border:1px solid #dbe6ff;color:#2e4c89}.section-title{margin:5px 0 15px;font-size:24px;letter-spacing:-.04em}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dce3ee;border-radius:12px;background:#fff;color:var(--ink);min-width:0}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}td:last-child,th:last-child{text-align:right}.pill{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;background:#edf2ff;color:#2e50bc}.pill.green{background:#e5f7ef;color:#137550}.pill.amber{background:#fff3dc;color:#916114}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #cbd5e4;border-radius:15px;background:#fbfcff}.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.goal-card h3{margin:0 0 5px;font-size:16px}.goal-card .goal-meta{font-size:12px;color:var(--muted);margin-bottom:14px}.goal-card .progress{background:#e8edf6;margin:12px 0}.goal-card .progress span{background:var(--blue)}.goal-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.hidden{display:none!important}.footer{color:var(--muted);font-size:11px;text-align:center;padding:22px 0}.modal-backdrop{position:fixed;inset:0;background:#071225aa;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:22px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #07122540}.modal h2{margin:0 0 16px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.icon-btn{border:0;background:#eef2f8;border-radius:10px;padding:8px 11px}.chartbar{display:flex;gap:4px;height:12px;border-radius:99px;overflow:hidden;background:#edf0f6;margin:12px 0}.chartbar span{display:block;height:100%}.muted{color:var(--muted)}.mini-actions{display:flex;gap:6px}.mini-actions button{padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:#fff}.two-buttons{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){.app{padding:14px 12px 30px}.top{padding:17px 13px}.hero{grid-template-columns:1fr;padding:22px;border-radius:22px}.hero-right{border-left:0;border-top:1px solid #ffffff2b;padding:16px 0 0}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid2,.goal-grid{grid-template-columns:1fr;gap:0}.field-grid{grid-template-columns:1fr}.metric{padding:15px}.panel{padding:16px}.tabs{margin-bottom:16px}.tab{padding:10px 13px}.top-actions{width:100%}.top-actions .btn{flex:1}}
</style></head><body>
<div class="top"><div class="brand"><div class="logo">₹</div><div><h1>My Money Planner</h1><p>Family budget · Separate portfolios · Future goals</p></div></div>
<div class="top-actions"><button class="btn dark" id="exportBtn">Export backup</button><button class="btn dark" id="importBtn">Import backup</button><button class="btn primary" id="quickAdd">+ Add entry</button><input id="importFile" type="file" accept="application/json" hidden></div></div>
<div class="app"><nav class="tabs" aria-label="Main sections"><button class="tab active" data-tab="dashboard">Overview</button><button class="tab" data-tab="budget">Budget & expenses</button><button class="tab" data-tab="investments">Investments</button><button class="tab" data-tab="assistant">Quick Add</button><button class="tab" data-tab="goals">Goals</button><button class="tab" data-tab="settings">Setup & data</button></nav><main id="view"></main><div class="footer">Private prototype: data stays in this browser on this device. Export backups regularly. Not connected to banks or brokers.</div></div><div id="modalRoot"></div>
<script>
const INR=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}),fmt=n=>INR.format(Number(n)||0),today=()=>new Date().toISOString().slice(0,10),monthNow=()=>today().slice(0,7),uid=()=>Math.random().toString(36).slice(2,10);
const defaults={profile:{income:188000,mahaSalary:0,mahaLOP:true,axisSavings:0,investmentBudget:39000,householdExpenseEstimate:30000,optionalCosts:{rent:0,creditCard:0,travel:0,onlineFood:0},people:['Me','Family portfolio'],notes:'Household take-home income ₹1,88,000. Explicit monthly investment allocations: Kuvera ₹29,000 (₹14,000 your share + ₹15,000 Dad contribution) and personal investments ₹10,000. Other expense amounts are estimates or need confirmation.'},
expenses:[],savingsLog:[],investments:[{id:'historic-gold',owner:'Me',name:'ICICI Prudential Gold ETF FOF',type:'Gold fund / FOF',value:5499,monthly:0,date:'2026-07-14',note:'Historical value mentioned in prior chat; NOT verified current value.',historical:true}],
goals:[{id:'home',name:'Hyderabad home',target:8000000,saved:1000000,monthly:0,years:10,owner:'Family',note:'Earlier discussion: home under ₹80 lakh and ₹10 lakh down payment. ₹10 lakh is a historical planning figure, not verified current savings.'},{id:'car',name:'7-seater electric car',target:0,saved:0,monthly:0,years:5,owner:'Family',note:'Goal mentioned: electric 7-seater with around 500 km range. Price not set.'},{id:'wealth',name:'Long-term wealth',target:0,saved:0,monthly:10000,years:10,owner:'Me',note:'Personal monthly investment allocation. Return is not guaranteed.'}],version:1};
let data;try{data=JSON.parse(localStorage.getItem('mmp-data')||'null')}catch(e){} if(!data)data=structuredClone(defaults);
data.profile={...defaults.profile,...(data.profile||{})};data.profile.optionalCosts={...defaults.profile.optionalCosts,...(data.profile.optionalCosts||{})};data.profile.mahaSalary=Number(data.profile.mahaSalary)||0;data.profile.mahaLOP=data.profile.mahaLOP!==false;data.profile.axisSavings=Number(data.profile.axisSavings)||0;if(Number(data.profile.investmentBudget)===68000){data.profile.investmentBudget=39000;data.profile.notes=defaults.profile.notes;}data.expenses=data.expenses||[];data.savingsLog=data.savingsLog||[];data.investments=data.investments||[];data.goals=data.goals||[];data.goals=data.goals.map(g=>g.id==='wealth'&&Number(g.monthly)===68000?{...g,monthly:10000,note:'Personal monthly investment allocation. Return is not guaranteed.'}:g);
let currentTab='dashboard';
function save(){localStorage.setItem('mmp-data',JSON.stringify(data));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function monthExpenses(m=monthNow()){return data.expenses.filter(x=>x.date&&x.date.slice(0,7)===m)}
function sum(a,key){return a.reduce((n,x)=>n+(Number(x[key])||0),0)}
function currentInvestments(){return sum(data.investments,'value')}
function investmentMonthly(){return sum(data.investments,'monthly')}
function monthOutgo(){return sum(monthExpenses(),'amount')}
function expenseBasis(){return monthExpenses().length?monthOutgo():(Number(data.profile.householdExpenseEstimate)||0)}
function optionalCostTotal(){return Object.values(data.profile.optionalCosts||{}).reduce((n,v)=>n+(Number(v)||0),0)}
function effectiveIncome(forMonth=monthNow()){let income=Number(data.profile.income)||0;let nextMonth=new Date();nextMonth.setDate(1);nextMonth.setMonth(nextMonth.getMonth()+1);let nextKey=nextMonth.toISOString().slice(0,7);if(data.profile.mahaLOP&&forMonth>=nextKey)income=Math.max(0,income-(Number(data.profile.mahaSalary)||0));return income}
function monthlyBalance(){return effectiveIncome(monthNow())-expenseBasis()-Number(data.profile.investmentBudget||0)-optionalCostTotal()}
function optionalCostRows(){const o=data.profile.optionalCosts||{};return [['House rent','rent','House rent'],['Credit-card bill','creditCard','Variable credit-card payment'],['Bike petrol / travel','travel','Transport spending'],['Online food orders','onlineFood','Food delivery / online orders']]}
function categoryRows(){let obj={};monthExpenses().forEach(e=>obj[e.category]=(obj[e.category]||0)+Number(e.amount||0));return Object.entries(obj).sort((a,b)=>b[1]-a[1])}
function setTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function panel(title,body,sub=''){return `<section class="panel"><div class="panel-head"><div><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}</div></div>${body}</section>`}
function metric(label,value,hint,cls=''){return `<div class="metric"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="hint">${hint}</div></div>`}
function progress(p){return `<div class="progress"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function expenseRows(){let es=[...data.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return es.length?table(['Date','Description','Category / owner','Amount',''],es.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.category)}<div class="small">${esc(e.owner)}</div></td><td>${fmt(e.amount)}</td><td><button class="mini-actions" onclick="deleteItem('expenses','${e.id}')">Delete</button></td></tr>`).join('')):`<div class="empty">No expenses entered yet. Add your first expense to start tracking actual spending.</div>`}
function investmentRows(){return data.investments.length?table(['Investment','Owner / type','Current value','Monthly SIP',''],data.investments.map(x=>`<tr><td><strong>${esc(x.name)}</strong>${x.historical?'<div class="small">Historical estimate · verify</div>':''}<div class="small">${esc(x.note||'')}</div></td><td>${esc(x.owner)}<div class="small">${esc(x.type)}</div></td><td>${fmt(x.value)}</td><td>${fmt(x.monthly)}</td><td><button onclick="editInvestment('${x.id}')">Edit</button> <button onclick="deleteItem('investments','${x.id}')">×</button></td></tr>`).join('')):`<div class="empty">No investment records yet. Add holdings manually; values do not sync with your broker.</div>`}
function dashboard(){
 const month=monthNow(),nextDate=new Date();nextDate.setDate(1);nextDate.setMonth(nextDate.getMonth()+1);const nextMonth=nextDate.toISOString().slice(0,7);
 const inc=effectiveIncome(month), nextInc=effectiveIncome(nextMonth), investmentPlan=Number(data.profile.investmentBudget)||39000;
 const planned=[['Home loan',26000,'Fixed'],['Cred loan',10000,'Fixed'],['Kuvera — your share',14000,'Investment'],['Malabar',20000,'Temporary · through Feb 2027'],['Kuvera — Dad contribution',15000,'Investment'],['House share with brother',20000,'Fixed · through Apr 2027'],['Maha loan',10000,'Fixed'],['Personal investments',10000,'Investment'],['Baby expenses',6000,'Estimate'],['Other household expenses',7500,'Estimate']];
 const fixedAndInvest=planned.reduce((a,x)=>a+x[1],0),optional=optionalCostTotal();
 const remaining=inc-fixedAndInvest-optional, nextRemaining=nextInc-fixedAndInvest-optional;
 return `<div class="hero"><div><div class="eyebrow">Family money · ${esc(month)}</div><h2>Your money, clearly organised.</h2><p>Current month and next month are calculated separately, including optional spending and Maha’s planned LOP.</p></div><div class="hero-right"><div class="small">Money left this month after known plan + optional costs</div><div class="big-number">${fmt(remaining)}</div><div class="progress"><span style="width:${inc>0?Math.max(0,Math.min(100,remaining/inc*100)):0}%"></span></div><div class="small">${fmt(fixedAndInvest)} plan + ${fmt(optional)} optional costs included</div></div></div>
 <div class="notice"><strong>LOP planning:</strong> Maha’s salary is set to be excluded from next month onward. Her take-home amount is currently ${fmt(data.profile.mahaSalary)} because you haven’t entered it yet. Add it in Setup & data; the app will subtract it from next month’s household take-home and recalculate the balance automatically. Optional costs are included even when you edit them.</div>
 <div class="metrics">${metric('Take-home this month',fmt(inc),'Current month')}${metric('Take-home next month',fmt(nextInc),data.profile.mahaLOP?'Maha salary excluded if entered':'LOP adjustment off')}${metric('Optional costs',fmt(optional),'Rent + card + travel + food')}${metric('Kuvera allocation',fmt(29000),'₹14k you + ₹15k Dad')}</div>
 <div class="grid2">${panel('Cash-flow forecast',`<div class="rowline"><div><strong>Take-home this month</strong><div class="meta">Current month income</div></div><div class="amount positive">${fmt(inc)}</div></div><div class="rowline"><div><strong>Known commitments + investments + estimates</strong><div class="meta">Loans, house share, Malabar, investments, baby and household</div></div><div class="amount">− ${fmt(fixedAndInvest)}</div></div><div class="rowline"><div><strong>Optional costs included</strong><div class="meta">Amounts editable in Setup & data</div></div><div class="amount">− ${fmt(optional)}</div></div><div class="rowline"><div><strong>Left this month</strong></div><div class="amount ${remaining<0?'negative':'positive'}">${fmt(remaining)}</div></div><div class="rowline"><div><strong>Forecast left next month</strong><div class="meta">After Maha LOP adjustment and same plan/costs</div></div><div class="amount ${nextRemaining<0?'negative':'positive'}">${fmt(nextRemaining)}</div></div>`,`Forecast is a planning view; enter the actual Maha take-home salary and your optional costs for a more accurate result.`)}${panel('Axis savings & monthly transfer',`<div class="rowline"><div><strong>Current Axis savings balance</strong><div class="meta">Enter/update your existing savings in Setup & data</div></div><div class="amount">${fmt(Number(data.profile.axisSavings)||0)}</div></div><div class="rowline"><div><strong>Estimated amount to transfer this month</strong><div class="meta">Remaining after known commitments, investments and optional costs</div></div><div class="amount ${remaining<0?'negative':'positive'}">${fmt(Math.max(0,remaining))}</div></div><div class="rowline"><div><strong>Estimated Axis balance after transfer</strong><div class="meta">Assumes the positive surplus is transferred once</div></div><div class="amount positive">${fmt((Number(data.profile.axisSavings)||0)+Math.max(0,remaining))}</div></div><div class="rowline"><div><strong>Estimated next-month transfer</strong><div class="meta">Uses next-month income after Maha’s LOP adjustment</div></div><div class="amount ${nextRemaining<0?'negative':'positive'}">${fmt(Math.max(0,nextRemaining))}</div></div><div class="form-actions"><button class="btn primary" onclick="setTab('settings')">Edit Axis savings balance</button></div>`,`Transfer is a forecast only; no bank transfer is made automatically. Enter your actual Axis balance to make the projection accurate.`)}${panel('Investment split',`<div class="rowline"><div><strong>Kuvera — your share</strong><div class="meta">Monthly contribution</div></div><div class="amount">${fmt(14000)}</div></div><div class="rowline"><div><strong>Kuvera — Dad contribution</strong><div class="meta">Kept as a separate source</div></div><div class="amount">${fmt(15000)}</div></div><div class="rowline"><div><strong>Total planned for Kuvera</strong></div><div class="amount positive">${fmt(29000)}</div></div><div class="rowline"><div><strong>Personal investment</strong><div class="meta">Separate allocation</div></div><div class="amount">${fmt(10000)}</div></div><div class="rowline"><div><strong>Total explicit monthly investing</strong></div><div class="amount positive">${fmt(investmentPlan)}</div></div><p class="small">The monthly investment budget can be edited in Setup & data; the detailed split above reflects the allocations you gave me.</p>`)}</div>
 <div class="grid2">${panel('Known monthly commitments',planned.map(([name,amount,note])=>`<div class="rowline"><div><strong>${esc(name)}</strong><div class="meta">${esc(note)}</div></div><div class="amount">${fmt(amount)}</div></div>`).join(''))}${panel('Optional monthly costs',optionalCostRows().map(([label,key,meta])=>`<div class="rowline"><div><strong>${label}</strong><div class="meta">${meta}</div></div><div class="amount">${fmt(data.profile.optionalCosts[key]||0)}</div></div>`).join('')+`<div class="form-actions"><button class="btn primary" onclick="setTab('settings')">Edit income & optional costs</button><button class="btn" onclick="setTab('budget')">Track actual expense</button></div>`,'Every amount here is included in the balance, even if it is optional or changes month to month.')}</div>`;
}

function assistantPage(){return `<h2 class="section-title">AI Quick Add</h2><div class="notice"><strong>Tell your money planner what happened.</strong> Try “spent 650 on groceries”, “saved 5000 to Axis”, “invested 2000 in Nifty index fund”, or “Axis balance is 85000”. This first version uses an on-device command parser and works offline; it is not yet a cloud AI chatbot.</div>${panel('Describe a transaction',`<textarea id="assistantText" rows="4" placeholder="Example: spent 650 on groceries today"></textarea><div class="form-actions"><button class="btn primary" onclick="assistantProcess()">Understand & update</button><button class="btn" onclick="document.getElementById('assistantText').value=''">Clear</button></div><div id="assistantResult" class="small" style="margin-top:12px"></div>`,`Never enter passwords, OTPs, or full account numbers.`)}${panel('Try an example',`<div class="rowline"><div><strong>Expense</strong><div class="meta">spent 650 on groceries</div></div><button class="btn" onclick="assistantExample('spent 650 on groceries')">Try</button></div><div class="rowline"><div><strong>Axis savings deposit</strong><div class="meta">saved 5000 to Axis</div></div><button class="btn" onclick="assistantExample('saved 5000 to Axis')">Try</button></div><div class="rowline"><div><strong>Investment</strong><div class="meta">invested 2000 in Nifty index fund</div></div><button class="btn" onclick="assistantExample('invested 2000 in Nifty index fund')">Try</button></div><div class="rowline"><div><strong>Set Axis balance</strong><div class="meta">Axis balance is 85000</div></div><button class="btn" onclick="assistantExample('Axis balance is 85000')">Try</button></div>`)}`}
function assistantExample(t){document.getElementById('assistantText').value=t;assistantProcess()}
function assistantProcess(){
 const el=document.getElementById('assistantText'),out=document.getElementById('assistantResult');if(!el||!out)return;
 const raw=el.value.trim(),txt=raw.toLowerCase(),m=raw.replace(/,/g,'').match(/(?:₹\s*)?(\d+(?:\\.\d{1,2})?)/);
 if(!raw){out.textContent='Type an expense, savings update, or investment first.';return}
 const amount=m?Number(m[1]):0,todayDate=new Date().toISOString().slice(0,10);
 if(!amount){out.textContent='Could not find an amount. Example: spent 650 on groceries.';return}
 if(/axis.*(balance|has|is)|(?:balance|savings balance).*axis/.test(txt)){
   data.profile.axisSavings=amount;save();render();setTimeout(()=>{let r=document.getElementById('assistantResult');if(r)r.textContent='Axis savings balance updated to '+fmt(amount)+'.'},0);return;
 }
 if(/\b(saved|save|deposit|transferred|transfer|put)\b/.test(txt)&&/\b(axis|savings|bank)\b/.test(txt)){
   data.profile.axisSavings=(Number(data.profile.axisSavings)||0)+amount;
   data.savingsLog.push({id:uid(),date:todayDate,name:'Axis savings deposit',amount,kind:'Deposit',note:raw});
   save();render();setTimeout(()=>{let r=document.getElementById('assistantResult');if(r)r.textContent='Added '+fmt(amount)+' to Axis savings. New tracked balance: '+fmt(data.profile.axisSavings)+'.'},0);return;
 }
 if(/\b(invest|invested|sip|bought|buy)\b/.test(txt)){
   let name=raw.replace(/.*?\b(?:invest(?:ed)?|sip|bought|buy)\b/i,'').replace(/^(\s*(₹\s*)?[\d,.]+\s*(in|into|on|to)?\s*)/i,'').trim()||'Investment (verify name)';
   data.investments.push({id:uid(),owner:/dad|father/.test(txt)?'Family':'Me',name,type:/gold/.test(txt)?'Gold fund / FOF':/etf/.test(txt)?'ETF':/stock|share/.test(txt)?'Stocks':'Mutual fund',value:amount,monthly:0,date:todayDate,note:'Added via Quick Add: '+raw,historical:false});
   save();render();setTimeout(()=>{let r=document.getElementById('assistantResult');if(r)r.textContent='Added investment of '+fmt(amount)+'. Please verify the investment name and value.'},0);return;
 }
 if(/\b(spent|expense|paid|bill|cost)\b/.test(txt)){
   let name=raw.replace(/\b(spent|expense|paid|bill|cost)\b/i,'').replace(/^(\s*(₹\s*)?[\d,.]+\s*(on|for|towards)?\s*)/i,'').trim()||'Quick Add expense';
   let category=/grocery|groceries|vegetable|milk/.test(txt)?'Groceries':/petrol|fuel|bike|travel/.test(txt)?'Transport':/rent|house/.test(txt)?'Housing':/baby|child|diaper/.test(txt)?'Family':/restaurant|online food|delivery/.test(txt)?'Eating out':'Other';
   data.expenses.push({id:uid(),name,amount,category,owner:/maha|spouse|wife/.test(txt)?'Spouse':'Family',date:todayDate});
   save();render();setTimeout(()=>{let r=document.getElementById('assistantResult');if(r)r.textContent='Added expense '+fmt(amount)+' for '+name+'.'},0);return;
 }
 out.textContent='I could not identify the action. Try “spent 650 on groceries”, “saved 5000 to Axis”, “invested 2000 in Nifty index fund”, or “Axis balance is 85000”. No changes were made.';
}
function budgetPage(){let baseline=Number(data.profile.householdExpenseEstimate)||0,actual=monthOutgo(),inc=effectiveIncome(monthNow()),inv=Number(data.profile.investmentBudget)||0,optional=optionalCostTotal();return `<h2 class="section-title">Budget & expenses</h2><div class="notice">Expense baseline ${fmt(baseline)} is your planning estimate; actual spending changes only when you add entries. Monthly balance below uses actual logged transactions, so enter expenses to make it meaningful.</div><div class="metrics">${metric('Expense estimate',fmt(baseline),'User-provided baseline')}${metric('Actual logged',fmt(actual),'This month')}${metric('Estimate remaining',fmt(baseline-actual),'Estimate minus logged')}${metric('After actual + investments + optional',fmt(inc-actual-inv-optional),'Includes optional costs',(inc-actual-inv-optional)<0?'negative':'positive')}</div><div class="grid2">${panel('Add an expense',`<form id="expenseForm"><div class="field-grid"><div class="field"><label>Description</label><input name="name" required placeholder="Groceries, rent, electricity"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Category</label><select name="category"><option>Housing</option><option>Groceries</option><option>Utilities</option><option>Transport</option><option>Healthcare</option><option>Education</option><option>Insurance</option><option>EMI / debt</option><option>Shopping</option><option>Eating out</option><option>Family</option><option>Other</option></select></div><div class="field"><label>Paid by / scope</label><select name="owner"><option>Family</option><option>Me</option><option>Spouse</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div></div><div class="form-actions"><button class="btn primary">Save expense</button></div></form>`)}${panel('Expense history',expenseRows())}</div>`}
function investmentsPage(){return `<h2 class="section-title">Separate investment portfolios</h2><div class="notice">Manual tracker only. Do not treat historical screenshots or values as current market value. Record account owner correctly and verify balances in your broker / AMC app.</div><div class="metrics">${metric('Personal holdings',fmt(sum(data.investments.filter(x=>x.owner==='Me'),'value')),'Owner: Me')}${metric('Family / other holdings',fmt(sum(data.investments.filter(x=>x.owner!=='Me'),'value')),'Owner labels kept separate')}${metric('Monthly SIPs recorded',fmt(investmentMonthly()),'Manually entered')}${metric('Monthly investment budget',fmt(data.profile.investmentBudget),'Household planning amount')}</div><div class="grid2">${panel('Add an investment',`<form id="investmentForm"><div class="field-grid"><div class="field"><label>Investment name</label><input name="name" required placeholder="Fund / stock / ETF"></div><div class="field"><label>Owner</label><select name="owner"><option>Me</option><option>Spouse</option><option>Family</option></select></div><div class="field"><label>Type</label><select name="type"><option>Mutual fund</option><option>Index fund</option><option>Gold fund / FOF</option><option>ETF</option><option>Stocks</option><option>EPF / PPF</option><option>FD / RD</option><option>Other</option></select></div><div class="field"><label>Current value (₹)</label><input name="value" type="number" min="0" value="0" required></div><div class="field"><label>Monthly SIP / contribution (₹)</label><input name="monthly" type="number" min="0" value="0" required></div><div class="field"><label>As-of date</label><input name="date" type="date" value="${today()}"></div><div class="field" style="grid-column:1/-1"><label>Notes / account label</label><input name="note" placeholder="Optional; never enter passwords or full account numbers"></div></div><div class="form-actions"><button class="btn primary">Add holding</button></div></form>`)}${panel('Holdings',investmentRows())}</div>`}
function futureValue(pmt,years,rate){let n=Math.max(0,Math.round(Number(years)*12)),r=Math.pow(1+rate,1/12)-1;if(!n)return 0;if(!r)return pmt*n;return pmt*((Math.pow(1+r,n)-1)/r)}
function goalCard(g){let target=Number(g.target)||0,saved=Number(g.saved)||0,monthly=Number(g.monthly)||0,years=Number(g.years)||0,proj=saved+futureValue(monthly,years,.08),pct=target?Math.min(100,saved/target*100):0;return `<div class="goal-card"><div class="panel-head"><div><h3>${esc(g.name)}</h3><div class="goal-meta">${esc(g.owner)} · ${years?years+' years':'Timeline not set'}</div></div><button onclick="editGoal('${g.id}')">Edit</button></div><div class="small">Target amount</div><div class="big-number" style="font-size:23px">${target?fmt(target):'Not set'}</div><div class="rowline"><div><strong>Saved so far</strong></div><div class="amount">${fmt(saved)}</div></div><div class="rowline"><div><strong>Monthly contribution</strong></div><div class="amount">${fmt(monthly)}</div></div>${progress(pct)}<div class="goal-foot"><span>${target?Math.round(pct)+'% of target saved':'Set target to track progress'}</span><span>${years?'Illustrative projection: '+fmt(proj):''}</span></div><p class="small">${esc(g.note||'')}</p></div>`}
function goalsPage(){return `<h2 class="section-title">Goals & projections</h2><div class="warning"><strong>Illustrative only:</strong> projections assume an 8% annual effective return on monthly contributions. Actual returns may be lower or negative; taxes, inflation and fees are excluded. Home goal values and timelines are historical planning assumptions unless you confirm them.</div><div class="panel"><div class="panel-head"><div><h3>Projection assumptions</h3><p class="sub">Change goal amount, current savings, monthly contribution and time horizon for each goal.</p></div><button class="btn primary" onclick="newGoal()">+ Add goal</button></div><div class="small">Known historical goal: Hyderabad home under ₹80 lakh, discussed with ₹10 lakh down payment and a 10-year investing idea. Current savings not confirmed. The app starts that goal at ₹10 lakh as a planning placeholder—edit it to your actual amount.</div></div><div class="goal-grid">${data.goals.map(goalCard).join('')}</div>`}
function settingsPage(){return `<h2 class="section-title">Setup & data</h2><div class="notice">These settings are saved locally in this browser. To use on Android, open the web app in Chrome and choose “Add to Home screen”. The source package also includes a minimal Android WebView wrapper project for building an APK in Android Studio.</div><div class="grid2">${panel('Household monthly plan',`<form id="profileForm"><div class="field-grid"><div class="field"><label>Current household take-home (₹)</label><input name="income" type="number" min="0" value="${Number(data.profile.income)||0}"><div class="small">Edit anytime; dashboard recalculates.</div></div><div class="field"><label>Maha monthly take-home salary (₹)</label><input name="mahaSalary" type="number" min="0" value="${Number(data.profile.mahaSalary)||0}"><div class="small">Enter the amount included in current household take-home.</div></div><div class="field"><label>Household expense estimate (₹)</label><input name="householdExpenseEstimate" type="number" min="0" value="${Number(data.profile.householdExpenseEstimate)||0}"></div><div class="field"><label>Monthly investment budget (₹)</label><input name="investmentBudget" type="number" min="0" value="${Number(data.profile.investmentBudget)||0}"></div><div class="field"><label>Current Axis savings balance (₹)</label><input name="axisSavings" type="number" min="0" value="${Number(data.profile.axisSavings)||0}"><div class="small">Enter the savings balance you already have in Axis.</div></div></div><div class="field" style="margin-top:14px"><label style="display:flex;align-items:center;gap:10px;color:var(--ink)"><input name="mahaLOP" type="checkbox" ${data.profile.mahaLOP?'checked':''} style="width:auto"> Maha is on LOP from next month (exclude her salary from next month onward)</label></div><h3 style="margin:20px 0 8px">Optional monthly costs (included in calculations)</h3><p class="small">All amounts are editable. Use ₹0 if not applicable; any change updates the Overview after saving.</p><div class="field-grid"><div class="field"><label>House rent (₹)</label><input name="rent" type="number" min="0" value="${Number(data.profile.optionalCosts.rent)||0}"></div><div class="field"><label>Credit-card bill (₹)</label><input name="creditCard" type="number" min="0" value="${Number(data.profile.optionalCosts.creditCard)||0}"></div><div class="field"><label>Bike petrol / travel (₹)</label><input name="travel" type="number" min="0" value="${Number(data.profile.optionalCosts.travel)||0}"></div><div class="field"><label>Online food orders (₹)</label><input name="onlineFood" type="number" min="0" value="${Number(data.profile.optionalCosts.onlineFood)||0}"></div></div><div class="field" style="margin-top:12px"><label>Notes</label><textarea name="notes" rows="3">${esc(data.profile.notes||'')}</textarea></div><div class="form-actions"><button class="btn primary">Save plan & recalculate</button></div></form>`)}${panel('Data safety & management',`<p class="small">No bank/broker connection. Your data is stored in local browser storage on this device and is not synced. Export a JSON backup before clearing browser data or changing phones.</p><div class="two-buttons"><button class="btn" onclick="exportData()">Export JSON backup</button><button class="btn" onclick="document.getElementById('importFile').click()">Import JSON backup</button><button class="btn danger" onclick="resetData()">Reset app data</button></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><strong>Starting assumptions</strong><div class="rowline"><div>Monthly take-home income</div><div class="amount">${fmt(data.profile.income)}</div></div><div class="rowline"><div>Expense estimate</div><div class="amount">${fmt(data.profile.householdExpenseEstimate)}</div></div><div class="rowline"><div>Investment budget</div><div class="amount">${fmt(data.profile.investmentBudget)}</div></div><div class="rowline"><div>Historic gold fund value (needs verification)</div><div class="amount">${fmt(data.investments.find(x=>x.id==='historic-gold')?.value||0)}</div></div>`,'')}</div>`}
function render(){let el=document.getElementById('view');el.innerHTML=({dashboard,budget:budgetPage,investments:investmentsPage,assistant:assistantPage,goals:goalsPage,settings:settingsPage})[currentTab]();bindForms()}
function bindForms(){let f=document.getElementById('expenseForm');if(f)f.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));data.expenses.push({id:uid(),...o,amount:Number(o.amount)});save();render();};f=document.getElementById('investmentForm');if(f)f.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));data.investments.push({id:uid(),...o,value:Number(o.value),monthly:Number(o.monthly),historical:false});save();render()};f=document.getElementById('profileForm');if(f)f.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));data.profile={...data.profile,income:Number(o.income)||0,mahaSalary:Number(o.mahaSalary)||0,mahaLOP:o.mahaLOP==='on',axisSavings:Number(o.axisSavings)||0,householdExpenseEstimate:Number(o.householdExpenseEstimate)||0,investmentBudget:Number(o.investmentBudget)||0,optionalCosts:{rent:Number(o.rent)||0,creditCard:Number(o.creditCard)||0,travel:Number(o.travel)||0,onlineFood:Number(o.onlineFood)||0},notes:o.notes};save();render()}}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal">${content}</div></div>`;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function newGoal(g={}){modal(`<div class="modal-head"><h2>${g.id?'Edit goal':'Add goal'}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><form id="goalForm"><div class="field-grid"><div class="field"><label>Goal name</label><input name="name" required value="${esc(g.name||'')}" placeholder="Emergency fund, home..."></div><div class="field"><label>Owner</label><select name="owner"><option ${g.owner==='Family'?'selected':''}>Family</option><option ${g.owner==='Me'?'selected':''}>Me</option><option ${g.owner==='Spouse'?'selected':''}>Spouse</option></select></div><div class="field"><label>Target amount (₹; 0 if unknown)</label><input name="target" type="number" min="0" value="${Number(g.target)||0}"></div><div class="field"><label>Saved so far (₹)</label><input name="saved" type="number" min="0" value="${Number(g.saved)||0}"></div><div class="field"><label>Monthly contribution (₹)</label><input name="monthly" type="number" min="0" value="${Number(g.monthly)||0}"></div><div class="field"><label>Years to goal</label><input name="years" type="number" min="0" max="80" value="${Number(g.years)||0}"></div><div class="field" style="grid-column:1/-1"><label>Notes / assumptions</label><textarea name="note" rows="3">${esc(g.note||'')}</textarea></div></div><div class="form-actions"><button class="btn primary">Save goal</button><button type="button" class="btn" onclick="closeModal()">Cancel</button>${g.id?`<button type="button" class="btn danger" onclick="deleteItem('goals','${g.id}');closeModal()">Delete</button>`:''}</div></form>`);document.getElementById('goalForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));Object.assign(o,{target:Number(o.target),saved:Number(o.saved),monthly:Number(o.monthly),years:Number(o.years)});if(g.id){data.goals=data.goals.map(x=>x.id===g.id?{...x,...o}:x)}else data.goals.push({id:uid(),...o});save();closeModal();render()}}
function editGoal(id){newGoal(data.goals.find(g=>g.id===id))}
function editInvestment(id){let x=data.investments.find(y=>y.id===id);if(!x)return;modal(`<div class="modal-head"><h2>Edit investment</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><form id="editInv"><div class="field-grid"><div class="field"><label>Name</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>Owner</label><select name="owner">${['Me','Spouse','Family'].map(o=>`<option ${x.owner===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>Type</label><input name="type" value="${esc(x.type)}"></div><div class="field"><label>Current value (₹)</label><input name="value" type="number" min="0" value="${x.value}"></div><div class="field"><label>Monthly SIP (₹)</label><input name="monthly" type="number" min="0" value="${x.monthly}"></div><div class="field"><label>As-of date</label><input name="date" type="date" value="${esc(x.date||today())}"></div><div class="field" style="grid-column:1/-1"><label>Notes</label><textarea name="note" rows="2">${esc(x.note||'')}</textarea></div></div><div class="form-actions"><button class="btn primary">Save</button><button type="button" class="btn" onclick="closeModal()">Cancel</button></div></form>`);document.getElementById('editInv').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));Object.assign(o,{value:Number(o.value),monthly:Number(o.monthly),historical:false});data.investments=data.investments.map(y=>y.id===id?{...y,...o}:y);save();closeModal();render()}}
function deleteItem(key,id){if(!confirm('Delete this record?'))return;data[key]=data[key].filter(x=>x.id!==id);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-planner-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(!confirm('This will erase all entries saved in this browser. Export a backup first. Continue?'))return;data=structuredClone(defaults);save();render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d.profile||!Array.isArray(d.expenses)||!Array.isArray(d.investments)||!Array.isArray(d.goals))throw Error('Invalid backup file');if(confirm('Replace current app data with this backup?')){data=d;save();render();alert('Backup imported.')}}catch(err){alert('Could not import this file. Please select a valid My Money Planner JSON backup.')}e.target.value=''};
document.getElementById('quickAdd').onclick=()=>{setTab('budget');setTimeout(()=>document.querySelector('#expenseForm input[name="name"]')?.focus(),50)};
function newGoalFromButton(){newGoal()}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
